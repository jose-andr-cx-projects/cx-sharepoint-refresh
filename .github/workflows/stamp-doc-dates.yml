name: Stamp changed document dates
on:
  push:
    branches: [main]
    paths:
      - 'docs/**.md'
permissions:
  contents: write
jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp documents changed by this push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            files=$(git diff-tree --no-commit-id --name-only -r "$AFTER" -- docs)
          else
            files=$(git diff --name-only "$BEFORE" "$AFTER" -- docs)
          fi
          if [ -n "$files" ]; then
            printf '%s\\n' "$files" | while IFS= read -r path; do
              python scripts/stamp_doc_dates.py "$path"
            done
          fi
      - name: Commit updated metadata
        run: |
          if git diff --quiet -- docs; then
            echo "No dates changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Stamp last-updated metadata for changed documentation"
          git push
